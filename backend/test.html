<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Agent Test</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; background: #f5f7fa; color: #1a202c; }
        .app { display: grid; grid-template-columns: 280px 1fr 320px; height: 100vh; gap: 1px; background: #e2e8f0; }
        
        /* Sidebar */
        .sidebar { background: #fff; padding: 20px; overflow-y: auto; }
        .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
        .brand-icon { width: 36px; height: 36px; background: #3b82f6; border-radius: 8px; display: grid; place-items: center; color: #fff; font-weight: 700; }
        .brand h1 { font-size: 16px; }
        .brand p { font-size: 12px; color: #64748b; }
        .section-title { font-size: 12px; font-weight: 600; color: #64748b; text-transform: uppercase; letter-spacing: 0.05em; margin: 20px 0 8px; }
        .preset { display: block; width: 100%; padding: 10px 12px; margin-bottom: 6px; border: 1px solid #e2e8f0; border-radius: 6px; background: #fff; text-align: left; font-size: 13px; cursor: pointer; transition: all 0.15s; }
        .preset:hover { border-color: #3b82f6; background: #eff6ff; }
        .schema-item { padding: 10px; margin-bottom: 6px; border: 1px solid #e2e8f0; border-radius: 6px; background: #f8fafc; font-size: 12px; }
        .schema-item strong { display: block; font-size: 13px; margin-bottom: 4px; }
        .schema-item code { color: #64748b; }
        
        /* Chat */
        .chat { background: #fff; display: flex; flex-direction: column; }
        .messages { flex: 1; overflow-y: auto; padding: 20px; }
        .message { max-width: 80%; margin-bottom: 16px; padding: 12px 16px; border-radius: 12px; line-height: 1.6; font-size: 14px; white-space: pre-wrap; }
        .message.user { background: #3b82f6; color: #fff; margin-left: auto; border-bottom-right-radius: 4px; }
        .message.agent { background: #f1f5f9; border: 1px solid #e2e8f0; border-bottom-left-radius: 4px; }
        .message .route-badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 99px; margin-top: 8px; }
        .message .route-badge.data { background: #dbeafe; color: #1d4ed8; }
        .message .route-badge.knowledge { background: #fef3c7; color: #92400e; }
        .composer { display: flex; gap: 8px; padding: 16px; border-top: 1px solid #e2e8f0; }
        .composer textarea { flex: 1; resize: none; border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px 14px; font: inherit; font-size: 14px; outline: none; }
        .composer textarea:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
        .composer button { padding: 0 20px; border: none; border-radius: 8px; background: #3b82f6; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
        .composer button:hover { background: #2563eb; }
        .composer button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        /* Insight panel */
        .insight { background: #fff; padding: 20px; overflow-y: auto; }
        .insight h2 { font-size: 14px; margin-bottom: 16px; }
        .insight-section { margin-bottom: 20px; }
        .insight-section h3 { font-size: 12px; font-weight: 600; color: #64748b; margin-bottom: 8px; }
        .empty { color: #94a3b8; font-size: 13px; }
        .metric-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .metric { padding: 12px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; }
        .metric .label { font-size: 11px; color: #64748b; }
        .metric .value { font-size: 18px; font-weight: 700; margin-top: 4px; }
        
        @media (max-width: 1024px) { .app { grid-template-columns: 1fr; } .sidebar, .insight { display: none; } }
    </style>
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <div class="brand">
                <div class="brand-icon">D</div>
                <div>
                    <h1>Data Agent</h1>
                    <p>LangChain + LangGraph + GLM</p>
                </div>
            </div>
            
            <div class="section-title">示例问题</div>
            <div id="presets"></div>
            
            <div class="section-title">数据表</div>
            <div id="schema"></div>
        </aside>
        
        <main class="chat">
            <div class="messages" id="messages"></div>
            <form class="composer" id="composer">
                <textarea id="input" rows="2" placeholder="输入你的数据问题..."></textarea>
                <button type="submit" id="send">发送</button>
            </form>
        </main>
        
        <aside class="insight">
            <h2>分析过程</h2>
            <div id="insight-content">
                <p class="empty">提问后将在这里展示分析过程</p>
            </div>
        </aside>
    </div>

    <script>
        const API = 'http://127.0.0.1:3007';
        const presets = [
            '最近30天销售额是多少，哪个渠道贡献最大？',
            '各地区订单量排名如何？',
            '退款率怎么样？',
            '新用户转化率如何？',
            '退款政策是什么？',
            'ROI怎么计算？',
            '企业版和专业版有什么区别？',
        ];
        
        const messagesEl = document.getElementById('messages');
        const inputEl = document.getElementById('input');
        const sendEl = document.getElementById('send');
        const composer = document.getElementById('composer');
        const presetsEl = document.getElementById('presets');
        const schemaEl = document.getElementById('schema');
        const insightEl = document.getElementById('insight-content');
        
        // Render presets
        presets.forEach(text => {
            const btn = document.createElement('button');
            btn.className = 'preset';
            btn.textContent = text;
            btn.onclick = () => { inputEl.value = text; inputEl.focus(); };
            presetsEl.appendChild(btn);
        });
        
        // Load schema
        fetch(`${API}/api/schema`).then(r => r.json()).then(data => {
            data.tables.forEach(t => {
                const div = document.createElement('div');
                div.className = 'schema-item';
                div.innerHTML = `<strong>${t.title} <code>${t.name}</code></strong>${t.fields.map(f => f.title).join('、')}`;
                schemaEl.appendChild(div);
            });
        });
        
        function addMessage(role, text, route = '') {
            const div = document.createElement('div');
            div.className = `message ${role}`;
            div.textContent = text;
            if (route) {
                const badge = document.createElement('span');
                badge.className = `route-badge ${route === 'data_analysis' ? 'data' : 'knowledge'}`;
                badge.textContent = route === 'data_analysis' ? '数据分析' : '业务知识';
                div.appendChild(badge);
            }
            messagesEl.appendChild(div);
            messagesEl.scrollTop = messagesEl.scrollHeight;
            return div;
        }
        
        async function send(message) {
            addMessage('user', message);
            sendEl.disabled = true;
            const loading = addMessage('agent', '正在分析...');
            
            try {
                const res = await fetch(`${API}/api/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message })
                });
                const data = await res.json();
                loading.remove();
                addMessage('agent', data.answer, data.routed_to);
                
                // Update insight panel
                insightEl.innerHTML = `
                    <div class="insight-section">
                        <h3>路由</h3>
                        <p>${data.routed_to === 'data_analysis' ? '数据分析 Agent' : '业务知识 Agent'}</p>
                    </div>
                    <div class="insight-section">
                        <h3>问题</h3>
                        <p>${data.question}</p>
                    </div>
                `;
            } catch (e) {
                loading.textContent = `错误: ${e.message}`;
            } finally {
                sendEl.disabled = false;
                inputEl.value = '';
                inputEl.focus();
            }
        }
        
        composer.onsubmit = (e) => { e.preventDefault(); if (inputEl.value.trim()) send(inputEl.value.trim()); };
        inputEl.onkeydown = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); composer.requestSubmit(); } };
        
        addMessage('agent', '你好！我是数据问答 Agent，基于 LangChain + LangGraph 构建。你可以问我数据查询问题或业务知识问题。');
    </script>
</body>
</html>
